name: Deploy Staging

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy_staging:
    name: Build and deploy to Firebase Hosting (staging preview)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting preview channel
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOLAO_DA_COPA }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: staging

      - name: Comment preview URL on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          DETAILS_URL: ${{ steps.firebase_deploy.outputs.details_url }}
          PREVIEW_URL: ${{ steps.firebase_deploy.outputs.preview_url }}
          EXPIRE_TIME: ${{ steps.firebase_deploy.outputs.expire_time }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const detailsUrl = process.env.DETAILS_URL;
            const previewUrl = process.env.PREVIEW_URL;
            const expireTime = process.env.EXPIRE_TIME;
            const prNumber = context.payload.pull_request.number;

            const body = [
              '✅ Deploy de **staging** concluído.',
              '',
              previewUrl ? `🔗 Preview URL: ${previewUrl}` : null,
              detailsUrl ? `📋 Detalhes do deploy: ${detailsUrl}` : null,
              expireTime ? `⏳ Expira em: ${expireTime}` : null
            ].filter(Boolean).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });
